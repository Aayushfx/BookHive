
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - BookHive</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header>
        <h1>🛒 BookHive</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="books.html">Books</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html" id="card-link">🛒 Cart (<span id="cart-count">0</span>)</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <section class="cart-section">
            <h2>Your Shopping Cart</h2>

            <table class="cart-table">
                <thead>
                    <tr>
                        <th scope="col">Book</th>
                        <th scope="col">Title</th>
                        <th scope="col">Price</th>
                        <th scope="col">Quantity</th>
                        <th scope="col">Subtotal</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>
                            <img
                                src="images/books/wings-of-fire.jpg"
                                alt="Wings of Fire book cover"
                                width="70"
                            >
                        </td>
                        <td>Wings of Fire</td>
                        <td>₹299</td>
                        <td>
                            <label for="qty-1">Quantity</label>
                            <input
                                type="number"
                                id="qty-1"
                                name="quantity-1"
                                value="1"
                                min="1"
                                max="99"
                            >
                        </td>
                        <td>₹299</td>
                        <td>
                            <button type="button">Remove</button>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <img
                                src="images/books/the-alchemist.jpg"
                                alt="The Alchemist book cover"
                                width="70"
                            >
                        </td>
                        <td>The Alchemist</td>
                        <td>₹349</td>
                        <td>
                            <label for="qty-2">Quantity</label>
                            <input
                                type="number"
                                id="qty-2"
                                name="quantity-2"
                                value="2"
                                min="1"
                                max="99"
                            >
                        </td>
                        <td>₹698</td>
                        <td>
                            <button type="button">Remove</button>
                        </td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <th colspan="4" scope="row">Total</th>
                        <td colspan="2">₹997</td>
                    </tr>
                </tfoot>
            </table>

            <div class="cart-actions">
                <a href="books.html">Continue Shopping</a>
                <button type="button">Proceed to Checkout</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 BookHive. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>

</body>
</html>
